name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            goarm: ''
            ext: ''
          - target: linux-arm64
            goos: linux
            goarch: arm64
            goarm: ''
            ext: ''
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: '7'
            ext: ''
          - target: linux-386
            goos: linux
            goarch: '386'
            goarm: ''
            ext: ''
          - target: freebsd-amd64
            goos: freebsd
            goarch: amd64
            goarm: ''
            ext: ''
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            goarm: ''
            ext: ''
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            goarm: ''
            ext: ''
          - target: windows-amd64
            goos: windows
            goarch: amd64
            goarm: ''
            ext: .exe
          - target: windows-arm64
            goos: windows
            goarch: arm64
            goarm: ''
            ext: .exe
          - target: windows-386
            goos: windows
            goarch: '386'
            goarm: ''
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          cache: true
          check-latest: true
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
      - name: Build
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          binary="sing-trusttunnel-${RELEASE_TAG}-${{ matrix.target }}${{ matrix.ext }}"

          mkdir -p dist
          go build -v -trimpath -ldflags='-w -s -buildid=' -tags "with_quic" -o "dist/${binary}" ./cmd/sing-trusttunnel
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: dist/sing-trusttunnel-*

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* --title "${RELEASE_TAG}"
          fi
